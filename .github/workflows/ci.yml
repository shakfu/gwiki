name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make ci

  # The release builds these platforms by cross-compiling on Linux; this runs
  # the tests where rename, ctime, os.Root and the terminal behave natively.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - if: runner.os == 'macOS'
        run: make test
      # The race detector needs cgo, which the Windows runner is not set up for.
      - if: runner.os == 'Windows'
        run: go test ./...
