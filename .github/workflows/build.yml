name: build

# A version tag, as the project tags releases: 0.5.0, without a v. Run by
# hand with a tag, it releases that existing tag; without one, it builds the
# chosen branch as version dev-<commit> and uploads the archives as a workflow
# artifact, releasing nothing.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing version tag, such as 0.5.0, to release. Empty to build the branch without releasing.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Empty for a build run by hand without a tag.
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - name: Check the version
        run: |
          if [ -z "$TAG" ]; then
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
            exit 0
          fi
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a version tag"; exit 1; }
          echo "VERSION=$TAG" >> "$GITHUB_ENV"

      # The whole history, so the release notes can come from the workflow's
      # own commit when that is not the tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG && format('refs/tags/{0}', env.TAG) || '' }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: make check

      - name: Warn on a version mismatch
        if: env.TAG != ''
        run: |
          grep -q "var version = \"$VERSION\"" cmd/gwiki/main.go ||
            echo "::warning file=cmd/gwiki/main.go::version is not $VERSION; go install builds report the old one"

      # Pure Go (modernc.org/sqlite), so one runner cross-compiles every target.
      - name: Build
        run: |
          set -euo pipefail
          mkdir dist
          while read -r goos goarch label; do
            name="gwiki-$VERSION-$label"
            bin=gwiki
            [ "$goos" = windows ] && bin=gwiki.exe
            mkdir "dist/$name"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "dist/$name/$bin" ./cmd/gwiki
            cp LICENSE README.md "dist/$name/"
            if [ "$goos" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
            rm -rf "dist/$name"
          done <<'EOF'
          darwin arm64 macos-arm64
          linux amd64 linux-x64
          windows amd64 windows-x64
          EOF
          (cd dist && sha256sum -- * > SHA256SUMS)

      - name: Upload the build
        if: env.TAG == ''
        uses: actions/upload-artifact@v7
        with:
          name: gwiki-${{ env.VERSION }}
          path: dist/

      - name: Release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The notes are the version's CHANGELOG section, from the commit this
          # workflow ran from: the tag when pushed, the branch when run by hand.
          # GitHub's own notes if it has none.
          git show "$GITHUB_SHA:CHANGELOG.md" |
            awk -v v="$VERSION" '$0 == "## [" v "]" {f=1; next} f && /^## \[/ {exit} f' > notes.md
          if [ -s notes.md ]; then
            gh release create "$VERSION" dist/* --title "$VERSION" --notes-file notes.md
          else
            gh release create "$VERSION" dist/* --title "$VERSION" --generate-notes
          fi
